name: Publish lambda artifact

# Publishes src/main.py as the versioned artifact zip that om-be's Terraform points
# aws_lambda_function.pdf at. This workflow does NOT deploy: om-be pins the version in
# infrastructure/terraform/backend/<env>/terraform.tfvars (pdf_lambda_source_version), and
# the new code only goes live on the next `terraform apply` there.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version to publish, e.g. v0.0.2 (must match om-be pdf_lambda_source_version)'
        required: true

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ASSUME_ROLE_NAME: orgamanager-gha-role
  ARTIFACT_BUCKET: om3-lambda-artifacts
  ARTIFACT_PREFIX: pdf-from-html

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ASSUME_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Define artifact key
        run: echo "ARTIFACT_KEY=${{ env.ARTIFACT_PREFIX }}/${{ inputs.version }}/artifact.zip" >> $GITHUB_ENV

      - name: Refuse to overwrite an existing version
        run: |
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$ARTIFACT_KEY" >/dev/null 2>&1; then
            echo "::error::s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY already exists."
            echo "aws_lambda_function.pdf has no source_code_hash, so it tracks the KEY, not the"
            echo "content. Overwriting in place would NOT redeploy the code. Publish a new version."
            exit 1
          fi

      - name: Build artifact
        run: cd src && zip artifact.zip main.py

      - name: Upload artifact
        run: aws s3 cp src/artifact.zip "s3://$ARTIFACT_BUCKET/$ARTIFACT_KEY"

      - uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('Lambda artifact published')
              .addRaw('`s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_KEY }}`')
              .addRaw('\n\nNot deployed yet. In om-be, set ')
              .addRaw('`pdf_lambda_source_version = "${{ inputs.version }}"` in ')
              .addRaw('`infrastructure/terraform/backend/<env>/terraform.tfvars`, then apply.')
              .write()
